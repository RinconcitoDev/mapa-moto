<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Moto Map GPS</title>
  <!-- Sin conexiones externas: sólo se permite cargar cosas de este mismo origen -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' pmtiles: blob: data:; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#080808">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="lib/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="lib/maplibre-gl.js" defer></script>
  <script src="lib/pmtiles.js" defer></script>
  <script src="map-logic.js" defer></script>
</head>

<body>
  <div id="distancia-info">0.00 km</div>

  <button id="rule-btn" class="btn-side" aria-label="Regla">📏</button>
  <button id="trip-btn" class="btn-side" aria-label="Iniciar/terminar tramo">🏁</button>
  <button id="poi-btn" class="btn-side" aria-label="Lugares de interés">📍</button>
  <button id="map-btn" class="btn-side" aria-label="Cambiar archivo de mapa">🗺️</button>

  <div id="ui-container">
    <div id="live-stats">
      <div style="display:flex; justify-content: space-between; align-items: center;">
        <span id="max-display">0 km/h</span>
        <span id="avg-display"></span>
      </div>
      <div id="coords-display">GPS: Buscando señal...</div>
    </div>
    <div id="history-panel">
      <div id="history-header">
        <strong>Historial de Tramos</strong>
        <span id="toggle-icon">▼</span>
      </div>
      <div id="trip-list"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="map-setup" hidden>
    <div class="map-setup-card">
      <h2>🗺️ Elegí tu mapa</h2>
      <p>Seleccioná el archivo <code>.pmtiles</code> que tenés en el celu.
        Se copia una sola vez al almacenamiento privado de la app y no sale del teléfono.</p>
      <label class="map-setup-btn">
        Elegir archivo
        <input id="map-input" type="file" hidden>
      </label>
      <div id="map-setup-status"></div>
      <button id="map-setup-cancel" type="button">Cancelar</button>
    </div>
  </div>
</body>

</html>
